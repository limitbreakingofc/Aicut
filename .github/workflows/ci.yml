name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-fedora:
    name: Fedora ${{ matrix.fedora }} tests and RPM build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora build and media dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config git curl file \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            openssl-devel librsvg2-devel libxdo-devel rpm-build \
            ffmpeg-free gstreamer1-plugins-base gstreamer1-plugins-good

      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cargo Test Workspace
        run: cargo test --workspace

      - name: Install, Typecheck & Build Web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI (Linux x86_64)
        run: cargo build --release -p aicut-cli

      - name: Build and verify Fedora RPM
        run: |
          pnpm tauri:build
          rpm -qpl apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          dnf install -y apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
