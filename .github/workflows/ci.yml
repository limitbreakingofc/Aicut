name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: Rust Tests & Web Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cargo Test Workspace
        run: cargo test --workspace
      - name: Install & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

  build-windows:
    name: Windows 11 Desktop & CLI Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cargo Test Workspace
        run: cargo test --workspace
      - name: Install Frontend Dependencies
        run: pnpm install
      - name: Build Tauri v2 Windows 11 Desktop App
        run: pnpm tauri:build
