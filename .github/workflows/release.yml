name: Release Linux Build (AppImage & Arch/CachyOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.11.0)"
        required: false
        default: "v0.11.0"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Publish Native Linux AppImage (Arch/CachyOS & NVIDIA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri v2, GStreamer & FFmpeg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            squashfs-tools \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Linux x86_64)
        run: |
          cargo build --release -p aicut-cli
          mkdir -p release-assets
          cp target/release/aicut release-assets/aicut-cli-linux-x86_64
          chmod +x release-assets/aicut-cli-linux-x86_64

      - name: Build Aicut Desktop App (Tauri v2 Linux AppImage)
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri:build

      - name: Collect Linux Release Assets
        run: |
          find apps/desktop/src-tauri/target/release/bundle -type f -name "*.AppImage" -exec cp {} release-assets/ \;
          cp packaging/arch/PKGBUILD release-assets/PKGBUILD
          ls -lh release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${{ inputs.tag || 'v0.11.0' }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Linux · Arch/CachyOS & NVIDIA)"
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## Novidades da ${{ steps.tag.outputs.name }} — Masterização Automática de Áudio YouTube (-14 LUFS) + Correção de Renderização do Motion Studio

            - **Correção definitiva da renderização do Motion Studio:**
              - Corrigida a captura RGBA do **HyperFrames** via Chromium CDP (`Page.enable`, sincronização real de pintura `requestAnimationFrame` antes de cada screenshot, recorte exato `1080×1920`, codificação segura de URL `file://`, progresso frame a frame e erro claro caso o Chromium não esteja instalado — nunca mais exporta silenciosamente sem as animações).
              - Fluxo dual explícito em **Cortes Shorts → Resultados**: agora você tem **`Renderizar padrão`** (sempre mantém o enquadramento/layout original) e, quando o corte já foi editado no Motion Studio, aparece o selo **`Motion editado`** + botão **`Renderizar Motion`** dedicado (além de salvar automaticamente antes de exportar dentro do Motion Studio).
            - **Tratamento e Masterização Automática de Áudio para YouTube (`-14 LUFS` / `-1.0 dBTP`):**
              - Aplicada automaticamente em **2 passos (EBU R128 linear)** nas exportações de **Cortes Shorts** e **Motion Studio**: corte de graves sub-sônicos (`highpass 75 Hz`), redução de ruído (**RNNoise Neural** quando instalado ou espectral adaptativo `afftdn`), equalização de clareza vocal, compressão dinâmica + limiter (nivela sussurros e gritos) e normalização oficial do YouTube (`-14 LUFS`, pico real `-1.0 dBTP`, 48 kHz).
              - Nova aba **`Áudio IA`** no menu lateral com presets (**YouTube/Shorts -14 LUFS**, **Reels/TikTok Impacto**, **Podcast -16 LUFS** ou **Desligado**), instalação em 1 clique do modelo neural **RNNoise** (~85 KB grátis) e masterização em 1 clique para qualquer vídeo/áudio da Biblioteca sem re-encodar o vídeo (`-c:v copy`).
          files: |
            release-assets/*
