name: Release Windows 11 Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows 11 Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Windows x64)
        run: |
          cargo build --release -p aicut-cli
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target\release\aicut.exe release-assets\aicut-cli-windows-x86_64.exe

      - name: Build Aicut Desktop App (Tauri v2 NSIS + MSI)
        run: pnpm tauri:build

      - name: Collect Windows 11 Installer Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
          }
          Get-ChildItem release-assets

      - name: Determine Release Tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            echo "name=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=${{ inputs.tag || 'v0.1.0' }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Windows 11)"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Aicut ${{ steps.tag.outputs.name }} — Estúdio Modular AI-First para Windows 11

            ### Novidades da v0.3.0
            - **Detecção Exata da Versão do CUDA (`13.x` / `12.x` / `11.x`)**: o Aicut agora lê diretamente a versão do CUDA suportada pelo seu driver NVIDIA (via `nvidia-smi`) e seleciona dinamicamente a **maior build CUDA compatível** de ferramentas como `whisper.cpp` (sem versão travada no código).
            - **Curadoria Inteligente de Modelos por GPU & Hardware**:
              - Na aba **Transcrever IA**, o Aicut mostra por padrão **apenas os melhores modelos compatíveis com a VRAM da sua GPU e RAM do seu PC** (com opção de ver todos os modelos).
              - **Seletor de Versões/Precisão por Família (`FP16`, `Q8_0`, `Q5_0`)**: alterne facilmente entre as versões de cada família (`Whisper Large v3 Turbo`, `Whisper Large v3`, `Large v2`) com **descrição clara de qual entrega a maior qualidade final** (`10/10`, `9.8/10`, `9.7/10`), VRAM exigida e velocidade.
              - **Troca rápida do modelo ativo** (salvo automaticamente) + **Desinstalação Completa** removendo arquivos `.bin`/`.part` do disco e mostrando exatamente quantos MB/GB foram liberados.
            - **Inclui todas as melhorias da v0.2.0**: `yt-dlp` corrigido (`--no-simulate --print-to-file` + `--impersonate`), 13 formatos de legenda e timeline (`SRT`, `VTT`, `ASS Karaokê`, `FCPXML DaVinci/CapCut`, `Premiere XML`, `EDL`, `OTIO`, `CSV`, `JSON`) salvos direto na **Biblioteca**, e controle completo por qualquer chat de IA via **MCP / OpenAPI 3.1 / CLI**.

            ### Como instalar / atualizar no Windows 11
            1. Baixe e execute **`Aicut_*_x64-setup.exe`** (recomendado) ou **`.msi`** nos assets abaixo.
            2. Em **Configurações → Ferramentas**, clique em **Instalar / Atualizar Tudo** para garantir `yt-dlp`, `FFmpeg` e `whisper.cpp` na melhor build para seu hardware/CUDA.
            3. Na aba **Transcrever IA**, escolha a versão ideal do melhor modelo compatível com sua GPU e comece a gerar legendas e timelines!
          files: |
            release-assets/*
