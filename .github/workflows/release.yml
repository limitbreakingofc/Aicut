name: Release Windows 11 Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.4)"
        required: false
        default: "v0.9.4"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows 11 Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Windows x64)
        run: |
          cargo build --release -p aicut-cli
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target\release\aicut.exe release-assets\aicut-cli-windows-x86_64.exe

      - name: Build Aicut Desktop App (Tauri v2 NSIS + MSI)
        run: pnpm tauri:build

      - name: Collect Windows 11 Installer Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
          }
          Get-ChildItem release-assets

      - name: Determine Release Tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            echo "name=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=${{ inputs.tag || 'v0.9.4' }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Windows 11)"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Aicut ${{ steps.tag.outputs.name }} — Estúdio Modular AI-First para Windows 11

            ### Novidades da v0.9.4
            - **Detector automático pixel a pixel de conteúdo pausado/estático (`detect_static_content_intervals`):** identifica exatamente quando o vídeo assistido embaixo fica pausado enquanto o streamer fala (mascarando a webcam) e envia esses trechos para a IA preencher com **ilustrações vetoriais SVG e animações sob medida**, mantendo o vídeo real visível quando está tocando.
            - **Zero padrões fixos antes da IA trabalhar:** se nenhuma edição for aplicada no Motion Studio, o corte preserva exatamente o enquadramento original salvo (`SMOKING33` / áreas de webcam e conteúdo).
            - **Gemini anti-503 + IA Local GPU no Motion Studio:** retentativas com backoff + failover entre até 6 modelos Gemini ativos + suporte nativo a `llama-server` (`Qwen2.5-VL` na GPU com fallback seguro de VRAM) e failover cruzado automático entre nuvem e local.
            - **Interface reorganizada em abas sem redundância + Motion Studio dirigido pelo Plano de Cortes:** 5 abas principais + `Configurações` unificada em 6 categorias (`IA & Chaves`, `Ferramentas`, `Sistema`, `Integrações`, `Módulos`, `Tarefas`).

            ### Como instalar / atualizar no Windows 11
            1. Baixe e execute **`Aicut_*_x64-setup.exe`** (recomendado) ou **`.msi`** nos assets abaixo.
            2. Em **Configurações → Ferramentas**, clique em **Instalar / Atualizar Tudo**.
            3. Em **Configurações → IA & Chaves**, configure sua chave Gemini API ou ative o modo **Local grátis (GPU)** com `Qwen2.5-VL`.
          files: |
            release-assets/*
