name: Release Linux Build (AppImage & Arch/CachyOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.10.1)"
        required: false
        default: "v0.10.1"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Publish Native Linux AppImage (Arch/CachyOS & NVIDIA)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri v2, GStreamer & FFmpeg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            squashfs-tools \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Linux x86_64)
        run: |
          cargo build --release -p aicut-cli
          mkdir -p release-assets
          cp target/release/aicut release-assets/aicut-cli-linux-x86_64
          chmod +x release-assets/aicut-cli-linux-x86_64

      - name: Build Aicut Desktop App (Tauri v2 Linux AppImage)
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri:build

      - name: Collect Linux Release Assets
        run: |
          find apps/desktop/src-tauri/target/release/bundle -type f -name "*.AppImage" -exec cp {} release-assets/ \;
          cp packaging/arch/PKGBUILD release-assets/PKGBUILD
          ls -lh release-assets

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${{ inputs.tag || 'v0.10.1' }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Linux · Arch/CachyOS & NVIDIA)"
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## Novidades da ${{ steps.tag.outputs.name }} — Migração Nativa para Linux (Arch / CachyOS & NVIDIA)

            - **Migração completa para Linux nativo (suporte a Windows encerrado):** build, CI e distribuição 100% focados em Linux com **AppImage universal** (base glibc 2.35 compatível com CachyOS / Arch Linux rolling, com GStreamer embutido para preview de vídeo) + **`PKGBUILD`** nativo para Arch/CachyOS.
            - **Compatibilidade total com NVIDIA no Linux (CUDA, NVENC e Vulkan):**
              - Proteção automática contra tela preta / erro GBM no WebKitGTK em sessões **Wayland + NVIDIA** (`WEBKIT_DISABLE_DMABUF_RENDERER=1` automático no boot, sobrescrevível via env).
              - Sanitização automática de `LD_LIBRARY_PATH` dentro do AppImage + suporte nativo a `/opt/cuda/lib64` (Arch/CachyOS) e preservação de symlinks `.so` para `llama-server` e `whisper-cli`.
              - Seleção inteligente de aceleração GPU: prioriza **CUDA** quando o CUDA Runtime está instalado (`pacman -S cuda`) ou **Vulkan** imediatamente out-of-the-box com `nvidia-utils`, além de **NVENC** em cortes, Motion Studio e proxy de preview.
            - **Download automático do FFmpeg Linux GPL (BtbN Static NVENC/CUDA/VAAPI)** e suporte nativo a `ffmpeg` do sistema (`pacman -S ffmpeg`), além de detecção automática de navegadores Chromium/Chrome/Brave/Vivaldi no Linux para o Motion Studio.

            ### Como rodar no CachyOS / Arch Linux
            - **Via AppImage (recomendado, sem instalação):**
              ```bash
              chmod +x Aicut_*_amd64.AppImage
              ./Aicut_*_amd64.AppImage
              ```
              *(Se não tiver `fuse2` instalado no Arch/CachyOS, execute com `--appimage-extract-and-run` ou instale `sudo pacman -S fuse2`.)*
            - **Ou nativo via `PKGBUILD` (opcional, compilado com flags do CachyOS):**
              Baixe o `PKGBUILD` abaixo e execute `makepkg -si`.
          files: |
            release-assets/*
