name: Release Fedora

on:
  push:
    branches: ["release/0.12.0"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.11.0)"
        required: true

permissions:
  contents: write

jobs:
  build-fedora:
    name: Build and publish Fedora RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora build and media dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config git curl file \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            openssl-devel librsvg2-devel libxdo-devel rpm-build \
            ffmpeg-free gstreamer1-plugins-base gstreamer1-plugins-good

      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Linux x86_64)
        run: |
          cargo build --release -p aicut-cli
          mkdir -p release-assets
          cp target/release/aicut release-assets/aicut-cli-fedora-x86_64
          chmod +x release-assets/aicut-cli-fedora-x86_64

      - name: Build and collect Fedora RPM
        run: |
          pnpm tauri:build
          cp apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm release-assets/
          ls -lh release-assets

      - name: Determine Release Tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v0.12.0' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            git check-ref-format "refs/tags/${RELEASE_TAG}"
            echo "name=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: 0179e142631881a5a4ac7b77ba0aa336be467df7
          name: "Aicut ${{ steps.tag.outputs.name }} (Fedora x86_64)"
          generate_release_notes: true
          body: |
            Desktop para Fedora 44 e 45 (x86_64). Instale o RPM com DNF.
            O binário aicut-cli-fedora-x86_64 fornece a CLI e o servidor MCP.
          fail_on_unmatched_files: true
          files: |
            release-assets/*
