name: Release Windows 11 Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows 11 Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Windows x64)
        run: |
          cargo build --release -p aicut-cli
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target\release\aicut.exe release-assets\aicut-cli-windows-x86_64.exe

      - name: Build Aicut Desktop App (Tauri v2 NSIS + MSI)
        run: pnpm tauri:build

      - name: Collect Windows 11 Installer Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
          }
          Get-ChildItem release-assets

      - name: Determine Release Tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            echo "name=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=${{ inputs.tag || 'v0.1.0' }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Windows 11)"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Aicut ${{ steps.tag.outputs.name }} — Estúdio Modular AI-First para Windows 11

            ### Novidades desta versão
            - **Correção Crítica do `yt-dlp`**: corrigido o bug onde `--print` ativava `--simulate`/`--quiet` sem iniciar o download. Agora usa `--no-simulate --progress --print-to-file` com UTF-8 nativo, drenagem completa de logs/erros, `CREATE_NO_WINDOW` no Windows 11 e opção `--impersonate` (Chrome/Edge/Firefox) para sites protegidos como Kick.
            - **Nova Aba 3 — Transcrever com IA Local (`whisper.cpp` + `Whisper Large v3 Turbo`)**:
              - Detecção automática de hardware no menu **Configurações → Ferramentas** baixando a melhor build do `whisper.cpp` (NVIDIA CUDA 12, OpenBLAS/AVX2 ou ARM64) e modelos GGML (`large-v3-turbo-q5_0`, `large-v3-turbo`, `small`, `medium`, `large-v3`).
              - **Exportador Universal (13 formatos)** salvando automaticamente na **Biblioteca**:
                - **Legendas**: `SRT`, `WebVTT`, `ASS Estilizada`, `ASS Karaokê (palavra a palavra)`, `LRC`
                - **Timelines de Editores**: `FCPXML 1.10` (DaVinci Resolve / CapCut / Final Cut), `Premiere Pro XML`, `EDL CMX 3600`, `OpenTimelineIO (.otio)`, `Marcadores CSV`
                - **Transcrições**: `TXT Limpo`, `TXT com Timecodes`, `JSON Palavra-a-Palavra (para IAs)`
            - **Biblioteca Expandida**: agora exibe vídeos, só vídeo, áudios, legendas, timelines e transcrições com preview integrado, cópia em 1 clique e botão direto para transcrever.
            - **Qualquer Chat de IA conectado com paridade humana**: MCP (`http://127.0.0.1:43210/mcp` + `aicut mcp`), OpenAPI 3.1 (`/openapi.json`) e CLI JSON (`aicut-cli-windows-x86_64.exe`).

            ### Como instalar / atualizar no Windows 11
            1. Baixe e execute **`Aicut_*_x64-setup.exe`** (recomendado) ou **`.msi`** nos assets abaixo.
            2. Abra o **Aicut**, vá em **Configurações → Ferramentas** e clique em **Instalar / Atualizar Tudo** para instalar/atualizar `yt-dlp`, `FFmpeg` e `whisper.cpp` na melhor versão para seu hardware.
          files: |
            release-assets/*
