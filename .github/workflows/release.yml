name: Release Windows 11 Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows 11 Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run Rust Tests
        run: cargo test --workspace

      - name: Install Frontend Dependencies & Build Web UI
        run: |
          pnpm install
          pnpm typecheck:web
          pnpm build:web

      - name: Build Aicut CLI & MCP Binary (Windows x64)
        run: |
          cargo build --release -p aicut-cli
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target\release\aicut.exe release-assets\aicut-cli-windows-x86_64.exe

      - name: Build Aicut Desktop App (Tauri v2 NSIS + MSI)
        run: pnpm tauri:build

      - name: Collect Windows 11 Installer Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/$($_.Name)"
          }
          Get-ChildItem release-assets

      - name: Determine Release Tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            echo "name=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=${{ inputs.tag || 'v0.1.0' }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Manual runs: create the tag on the commit that was actually built (not the default branch)
          target_commitish: ${{ github.sha }}
          name: "Aicut ${{ steps.tag.outputs.name }} (Windows 11)"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Aicut ${{ steps.tag.outputs.name }} — Estúdio Modular AI-First para Windows 11

            ### Novidades da v0.5.2 — IA Diretor de Conteúdo (Janela Inferior: Quem Está Falando + Ação em Destaque)
            - **Foco Dinâmico em Quem Está Falando (`smart_focus` — novo padrão da janela de baixo):** detecta os rostos na área do conteúdo (vídeos reagidos, entrevistas, podcasts, cutscenes) e mede a atividade labial/mandibular frame a frame com histerese editorial — acompanhando quem está falando de verdade, enquadrando em *two-shot* quando duas pessoas cabem juntas ou fazendo corte limpo de câmera quando a fala muda de lado!
            - **Rastreamento do Momento de Ação / Destaque (Gameplay, Trailers & Demos):** quando não há um orador em primeiro plano, uma grade visual 32×18 de movimento compensado por pan + contraste/saturação desliza a janela de recorte para capturar automaticamente o ponto de maior ação/destaque em cada instante.
            - **Máscara Anti-Duplicação da Webcam:** mascara automaticamente a caixa da webcam do streamer (já exibida na janela superior) para que a janela inferior nunca persiga nem duplique a webcam do canto.
            - **Extração Única + Dual `sendcmd` (`crop@cam` + `crop@content` a 20 Hz):** analisa as duas janelas em uma única passada de frames com física suave de câmera e 100% da aceleração NVENC da GPU.

            ### Novidades da v0.5.1 — IA Cameraman: Rastreamento Facial Suave & Webcam Sem Bordas
            - **IA Facial 100% Nativa em Rust (`tract-onnx` + `UltraFace RFB-320` ~1,2 MB, zero Python/DLL):** detecta o rosto do apresentador ao longo de todo o corte com **filtro anti-NPC** (não confunde o streamer com personagens do jogo).
            - **Eliminação Automática de Bordas da Webcam (Mediana Temporal + Inset Anti-Borda):** identifica as 4 paredes exatas da caixa da webcam do OBS e trava matematicamente o enquadramento dentro da área limpa — **zero bordas ou vazamento da gameplay na janela de cima**!
            - **Movimento Natural de Câmera Durante o Vídeo Todo (`FFmpeg sendcmd` + `crop@cam` dinâmico):** aplica composição na regra dos terços (olhos a 38% do topo) com física de tripé fluido (*deadzone*, velocidade máxima suave, *hold* em oclusão e corte seco em troca de cena), mantendo 100% da aceleração NVENC da GPU.
            - **Novos controles na aba Cortes Shorts IA:** modo padrão **`Automático · IA detecta webcam, remove bordas e segue rosto`**, seletor de **Zoom do Rosto** (*Aberto / Natural / Close*) e **Margem anti-borda** (*3% / 4.5% / 8%*).

            ### Correções da v0.4.6 — Gemini 3.8 Automático & Contexto 16k para Lives no Modo Local
            - **Gemini API atualizada & à prova de futuro (`gemini-3.8-flash` / `gemini-3.8-pro` + auto-descoberta):** corrigido o HTTP 404 dos modelos antigos `gemini-2.5-*`. Agora o Aicut consulta automaticamente os modelos disponíveis na sua chave Gemini, escolhe o melhor Flash/Pro mais recente (com opção **Automático** e fallback seguro caso Pro não esteja liberado na chave) e migra configurações antigas sem precisar reconfigurar.
            - **Modo Local Free (`llama-server`) calibrado para lives longas (zero `exceed_context_size_error`):** contexto dinâmico por VRAM (**16k tokens** em GPUs >= 10 GB como RTX 3060 12 GB, **12k** em 6–9 GB e **8k** em 4 GB/CPU), blocos de 10 min com 3 min de overlap e compactação automática segura caso algum trecho ultrapasse o limite.

            ### Novidades da v0.4.5 — Nova Interface Estilo Terminal Moderno
            - **Visual de terminal moderno, em largura total**: tipografia mono (Cascadia Code / JetBrains Mono), painéis com bordas finas e cabeçalhos estilo TUI, tabelas densas no estilo `ls -la`, barra de progresso em blocos e barra de status inferior clicável (estado do core MCP, tarefas, mídias, ferramentas e GPU).
            - **Menus de botão direito em todo o app**: mídias (abrir, transcrever, cortes, copiar caminho/ID, mover para a Lixeira), seleção múltipla em lote, tarefas (cancelar, logs, copiar erro), transcrições (exportar em qualquer formato), falas, cortes, modelos, ferramentas, módulos, atividade e caminhos do workspace — com navegação por teclado e botões `⋯` equivalentes.
            - **Atalhos de teclado**: `Ctrl+K` paleta de comandos, `Alt+1…8` troca de tela, `Ctrl+B` recolhe o menu lateral, `?` mostra todos os atalhos; na Biblioteca `/` busca, `↑ ↓` navega, `Espaço`/`Ctrl+clique` seleciona, `Ctrl+A` seleciona tudo e `Del` move para a Lixeira.
            - **Biblioteca reorganizada**: lista densa com miniaturas (ou grade), colunas que se adaptam à largura, inspetor encaixado e redimensionável, abas Biblioteca/Lixeira e barra de ações em lote — mantendo toda a Lixeira e a seleção múltipla da v0.4.4.
            - **Telas reorganizadas**: Baixar & Importar com tabela de formatos estilo `yt-dlp -F` e painel "Comando" com o JSON exato enviado ao core; Transcrever em abas (nova transcrição · transcrições · modelos); Cortes Shorts com seletor visual de enquadramento 9:16 e medidores de pontuação; Fila de Tarefas estilo monitor de processos; feed de atividade das IAs estilo `tail -f`.
            - **4 esquemas de cor**: Noite (padrão), Fósforo, Âmbar e Claro.
            - **Correções**: indicador de conexão não fica mais preso em "Reconectando" após recarregar a interface; ícones de carregamento agora giram; painéis da tela de Cortes que apareciam sem fundo/borda.

            ### Novidades da v0.4.4 — Seleção Múltipla, "Selecionar Tudo" e Lixeira da Biblioteca
            - **Seleção Múltipla & "Selecionar Tudo" na Biblioteca**: marque vários arquivos (ou todos os filtrados com 1 clique) para **Mover para a Lixeira** ou **Apagar Permanentemente do Disco** em lote, exibindo exatamente quantos MB/GB foram liberados.
            - **Lixeira da Biblioteca (`media.trash_list`, `media.restore`, `media.trash_empty`, `media.bulk_delete`)**: arquivos removidos sem exclusão permanente do disco agora ficam salvos na aba **Lixeira** dentro da Biblioteca (com contador e espaço ocupado), permitindo **Restaurar** com 1 clique, **Excluir selecionados permanentemente** ou **Esvaziar Lixeira**.

            ### Novidades da v0.4.3 — Acesso Total à Biblioteca & Linhagem por ID do Vídeo
            - **Resolução Automática de Transcrição em Toda a Biblioteca (`find_best_transcript_for_media`)**: a IA de Cortes Shorts agora localiza automaticamente a transcrição do vídeo em qualquer lugar da Biblioteca — pelo `media_id` exato, por mídia irmã/pai (ex.: download de áudio e vídeo do mesmo link ou mesmo ID externo `[fPQDxLwScrA]`), por referência `transcript_id`, ou lendo diretamente arquivos `.json`, `.srt` e `.vtt` vinculados na Biblioteca/disco!
            - **Linhagem Unificada por ID (`video_id:<id>` + `parent_media_id`)**: tudo que é gerado a partir de um vídeo (legendas, timelines, transcrições e Shorts renderizados) carrega automaticamente o ID do vídeo original para que a IA e a interface identifiquem instantaneamente todos os arquivos daquele projeto.
            - **Nova Action `clips.media_context` + Painel na UI**: mostra o `video_id`, chave externa (`yt:...`), origem da transcrição detectada e total de arquivos vinculados na Biblioteca, além de informar à IA quais Shorts já foram gerados para evitar repetições.

            ### Novidades da v0.4.2 — Moldura Shorts Padrão (Câmera em Cima + Conteúdo em Baixo)
            - **Moldura PNG 9:16 Integrada (`SMOKING33`) como Layout Padrão (`template_split`)**: embutida direto no Aicut com recorte transparente automático de alta precisão — **Câmera na janela superior** (`1020×582`) e **Conteúdo/Gameplay na janela inferior** (`1020×889`), com bordas arredondadas e douradas perfeitas por cima do vídeo!
            - **Suporte a qualquer Moldura PNG Personalizada**: o detector de canal alpha lê automaticamente as duas janelas transparentes de qualquer PNG 9:16 que você escolher.
            - **Split Sem Moldura (`gaming_split`) atualizado**: agora também segue o padrão **Câmera em Cima + Conteúdo em Baixo**, com seletor de origem da webcam (4 cantos ou centro) e modo de ajuste do conteúdo (*Preencher* ou *Tela 16:9 inteira + Blur*).
            - **Inclui a correção da v0.4.1** de compatibilidade com FFmpeg 8 (`-fps_mode vfr`).

            ### Novidades da v0.4.0 — Cortes Shorts IA (Visual + Narrativa até 3 min)
            - **Novo Módulo `Cortes Shorts IA` (`smart-clips`)**: assiste vídeos e lives usando **IA visual multimodal**, segue sua descrição editorial e encontra cortes coerentes com **Início (gancho 5s) → Meio → Fim** de até **3 minutos (180s)**, com snap cirúrgico em fronteiras de palavras.
            - **Motor Dual-Engine (Nuvem + 100% Local Grátis)**:
              - **Gemini API (`gemini-2.5-flash` + `gemini-2.5-pro`)**: visão + áudio nativos em janelas de 25 min com 3 min de sobreposição (0 MB de download local).
              - **Local Free (`llama.cpp` + `Qwen2.5-VL` 7B/3B GGUF)**: o Aicut detecta automaticamente sua GPU/VRAM/CUDA, instala a melhor build do **`llama-server`** (CUDA + `cudart` / Vulkan / Metal / CPU) pelo próprio app e recomenda a melhor quantização compatível com sua placa.
            - **Renderização Shorts 9:16 (`1080x1920`) Acelerada por Hardware (`NVENC` / `AMF` / `QSV`)**: layouts *Tela Inteira + Blur*, *Foco Central*, *Split Gameplay + Webcam* e *Original 16:9*, com opção de queimar legendas Karaokê sincronizadas e salvar direto na Biblioteca.
            - **Inclui todas as melhorias das versões anteriores (`v0.3.0` / `v0.2.0`)**: detecção exata de CUDA, curadoria de modelos Whisper por GPU, 13 formatos de legenda/timeline e controle completo via MCP / OpenAPI / CLI.

            ### Como instalar / atualizar no Windows 11
            1. Baixe e execute **`Aicut_*_x64-setup.exe`** (recomendado) ou **`.msi`** nos assets abaixo.
            2. Em **Configurações → Ferramentas**, clique em **Instalar / Atualizar Tudo** para garantir `yt-dlp`, `FFmpeg` e `whisper.cpp` na melhor build para seu hardware/CUDA.
            3. Na aba **Transcrever IA**, escolha a versão ideal do melhor modelo compatível com sua GPU e comece a gerar legendas e timelines!
          files: |
            release-assets/*
